<html lang="pt-BR">

<style>
:root{--fg:#33ff66;--dim:#1f9940;--bg:#050a05;--glow:rgba(51,255,102,.55);--hl:#c8ffd6}

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000}
body{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono","VT323","Courier New",ui-monospace,monospace}
#tela{position:relative;width:min(1100px,100vw);height:min(760px,100dvh);background:var(--bg);color:var(--fg);
  text-shadow:0 0 6px var(--glow);overflow:hidden;border-radius:18px;
  box-shadow:0 0 0 10px #1a1a18,0 0 0 12px #000,0 0 60px var(--glow),inset 0 0 120px rgba(0,0,0,.7)}
@media(max-width:700px){#tela{border-radius:0;box-shadow:inset 0 0 80px rgba(0,0,0,.7);width:100vw;height:100dvh}}
#tela::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#tela::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.93}52%{opacity:1}}
#rolagem{position:absolute;inset:0 0 44px 0;overflow-y:auto;padding:18px 22px 8px;font-size:15px;line-height:1.45;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
@media(max-width:700px){#rolagem{font-size:13px;padding:12px 12px 6px}}
#saida>div{white-space:pre-wrap;word-break:break-word;min-height:1.45em}
.dim{color:var(--dim)}.hl{color:var(--hl);font-weight:700}.err{color:#ff6b6b;text-shadow:0 0 6px rgba(255,80,80,.5)}
a{color:var(--hl);text-decoration:underline dotted}a:hover{background:var(--fg);color:var(--bg);text-shadow:none}
.cmd{color:var(--hl);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.cmd:hover{background:var(--fg);color:var(--bg);text-shadow:none}
.box{border:1px solid var(--dim);padding:6px 10px;margin:4px 0;display:inline-block;max-width:100%}
#linha{display:flex;align-items:center;gap:.6ch}
#prompt{white-space:pre;color:var(--hl)}
#entrada{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;text-shadow:inherit;caret-color:var(--fg);caret-shape:block;padding:0}
#atalhos{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;gap:6px;align-items:center;padding:0 12px;overflow-x:auto;
  border-top:1px solid var(--dim);background:var(--bg);z-index:4;scrollbar-width:none}
#atalhos button{flex:none;font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:3px;padding:4px 9px;cursor:pointer;text-shadow:inherit}
#atalhos button:hover,#atalhos button:focus-visible{background:var(--fg);color:var(--bg);text-shadow:none;outline:0}
pre.jogo{margin:4px 0;line-height:1.1;font-size:15px;color:var(--fg)}
.ctl{display:inline-grid;grid-template-columns:repeat(3,44px);gap:4px;margin:6px 0}
.ctl button{height:38px;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--dim);cursor:pointer}
.ctl button:active{background:var(--fg);color:var(--bg)}
.pular{position:absolute;top:10px;left:22px;z-index:7;font-size:12px;color:var(--dim)}
#idioma{position:absolute;top:10px;right:22px;z-index:7;font:inherit;font-size:12px;color:var(--dim);background:var(--bg);border:1px solid var(--dim);border-radius:3px;padding:2px 7px;cursor:pointer;text-shadow:inherit}
#idioma b{font-weight:400}#idioma b.on{color:var(--hl);font-weight:700}#idioma:hover,#idioma:focus-visible{outline:0;border-color:var(--fg)}
@media(prefers-reduced-motion:reduce){#tela::after{animation:none}}
</style>
</head>

];

for(const k of Object.keys(cmds))if(!ALIAS[k])ALIAS[k]=k;
const OCULTOS=new Set(["konami","hello","vim","cd","pwd","whoami","date","echo","sudo","rm","exit"]);
const nomesAtuais=()=>Object.keys(cmds).filter(k=>!OCULTOS.has(k)).map(k=>NOME[k]?NOME[k][lang]:k);

/* ---------- efeitos e jogo ---------- */
let rodando=null; // loop do jogo/matrix
function chuva(){
  const cv=document.createElement("canvas");cv.width=Math.min(640,rol.clientWidth-44);cv.height=200;cv.style.cssText="display:block;max-width:100%;border:1px solid var(--dim)";
  const x=cv.getContext("2d");const cols=Math.floor(cv.width/12);const y=Array(cols).fill(0);const d=imp("");d.appendChild(cv);imp(`<span class="dim">${T("(qualquer tecla para sair)","(press any key to exit)")}</span>`);
  const cor=getComputedStyle(tela).getPropertyValue("--fg").trim();let n=0;
  rodando={tecla(){clearInterval(i);rodando=null},fim:true};
  const i=setInterval(()=>{x.fillStyle="rgba(0,0,0,.12)";x.fillRect(0,0,cv.width,cv.height);x.fillStyle=cor;x.font="12px monospace";
    y.forEach((v,k)=>{x.fillText(String.fromCharCode(0x30A0+Math.random()*96),k*12,v*12);y[k]=v*12>cv.height&&Math.random()>.95?0:v+1});if(++n>400){clearInterval(i);rodando=null}},60)}

function snake(){
  const W=28,H=14;let cobra=[[5,7],[4,7],[3,7]],dir=[1,0],prox=[1,0],comida=[18,7],pts=0,vivo=true;
  let rec=0;try{rec=+localStorage.getItem("snake")||0}catch(e){}
  const pre=document.createElement("pre");pre.className="jogo";const box=imp("");box.appendChild(pre);
  const info=imp("");
  const ctl=document.createElement("div");ctl.className="ctl";
  [["",""],["▲","c"],["",""],["◀","a"],["▼","b"],["▶","d"]].forEach(([t,k])=>{const b=document.createElement("button");b.textContent=t;b.style.visibility=t?"visible":"hidden";
    b.addEventListener("pointerdown",e=>{e.preventDefault();mover(k==="c"?[0,-1]:k==="b"?[0,1]:k==="a"?[-1,0]:[1,0])});ctl.appendChild(b)});
  const wrap=imp("");wrap.appendChild(ctl);
  function mover(d){if(d[0]!==-dir[0]||d[1]!==-dir[1])prox=d}
  function soltar(){const c=[0,0];do{c[0]=Math.floor(Math.random()*W);c[1]=Math.floor(Math.random()*H)}while(cobra.some(s=>s[0]===c[0]&&s[1]===c[1]));comida=c}
  function desenhar(){
    let s="┌"+"─".repeat(W)+"┐\n";
    for(let j=0;j<H;j++){s+="│";for(let i=0;i<W;i++){s+=cobra[0][0]===i&&cobra[0][1]===j?"@":cobra.some(p=>p[0]===i&&p[1]===j)?"o":comida[0]===i&&comida[1]===j?"*":" "}s+="│\n"}
    pre.textContent=s+"└"+"─".repeat(W)+"┘";
    info.textContent=vivo?T(`pontos: ${pts}   recorde: ${rec}   (setas/WASD, q sai)`,`score: ${pts}   best: ${rec}   (arrows/WASD, q quits)`)
      :T(`GAME OVER — ${pts} pontos${pts>rec?" · NOVO RECORDE!":""}. Digite 'jogar' para tentar de novo.`,`GAME OVER — ${pts} points${pts>rec?" · NEW RECORD!":""}. Type 'play' to try again.`)}
  function fim(){clearInterval(t);rodando=null;if(pts>rec){try{localStorage.setItem("snake",pts)}catch(e){}}desenhar();ent.focus()}
  function passo(){
    dir=prox;const c=[cobra[0][0]+dir[0],cobra[0][1]+dir[1]];
    if(c[0]<0||c[1]<0||c[0]>=W||c[1]>=H||cobra.some(s=>s[0]===c[0]&&s[1]===c[1])){vivo=false;return fim()}
    cobra.unshift(c);if(c[0]===comida[0]&&c[1]===comida[1]){pts++;soltar()}else cobra.pop();desenhar()}
  rodando={tecla(e){const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
    if(m){mover(m)}else if(e.key==="q"||e.key==="Escape"){vivo=false;fim()}}};
  const t=setInterval(passo,110);desenhar()}

/* ---------- terminal ---------- */
const T0=Date.now();let pulou=false,hist=[],hi=0,bootFeito=false;
const PS=()=>T("visitante","visitor")+"@lazaro:~$";
function mostrarPrompt(){pr.textContent=PS();linha.hidden=false;ent.focus({preventScroll:true});rol.scrollTop=rol.scrollHeight}
async function executar(txt){
  const bruto=txt.trim();
  imp(`<span class="hl">${esc(PS())}</span> ${esc(txt)}`);
  if(!bruto)return;
  hist.push(bruto);hi=hist.length;
  const [c,...a]=bruto.split(/\s+/);const k=ALIAS[c.toLowerCase()];
  if(k&&Object.prototype.hasOwnProperty.call(cmds,k))cmds[k](a);
  else{const sug=nomesAtuais().find(n=>n.startsWith(c.toLowerCase().slice(0,2)));
    imp(`${esc(c)}: ${T("comando não encontrado.","command not found.")} ${sug?`${T("Quis dizer","Did you mean")} ${C(sug)}? `:""}${T("Digite","Type")} ${C(nm("ajuda"))}.`,"err")}
}
function montarAtalhos(){
  atalhos.textContent="";
  ["sobre","experiencia","projetos","skills","contato","ajuda"].map(k=>[nm(k),nm(k)]).concat([[T("tema azul","theme blue"),T("tema azul","theme blue")]]).forEach(([t,c])=>{
    const b=document.createElement("button");b.textContent=t;b.onclick=()=>{if(!bootFeito){pulou=true;return}if(rodando)return;executar(c);ent.focus({preventScroll:true})};atalhos.appendChild(b)})}
function aplicarIdioma(){
  document.documentElement.lang=lang==="pt"?"pt-BR":"en";
  btnIdioma.innerHTML=`<b${lang==="pt"?' class="on"':""}>PT</b>|<b${lang==="en"?' class="on"':""}>EN</b>`;
  btnIdioma.setAttribute("aria-label",T("Mudar idioma para inglês","Switch language to Portuguese"));
  $("#dica").textContent=T("[ qualquer tecla: pular boot ]","[ any key: skip boot ]");
  ent.setAttribute("aria-label",T("Comando","Command"));
  document.title=T("Lázaro Queiroz — terminal","Lázaro Queiroz — terminal");
  if(bootFeito)pr.textContent=PS();
  montarAtalhos()}
function mudarIdioma(novo){
  if(novo===lang)return imp(T("O idioma já é português.","Language is already English."));
  lang=novo;try{localStorage.setItem("lang",lang)}catch(e){}aplicarIdioma();
  saida.innerHTML="";boasVindas();imp(T("Idioma: português.","Language: English."),"dim")}
btnIdioma.addEventListener("click",()=>{if(!bootFeito){pulou=true}if(rodando)return;mudarIdioma(lang==="pt"?"en":"pt");ent.focus({preventScroll:true})});

ent.addEventListener("keydown",e=>{
  if(rodando){e.preventDefault();rodando.tecla&&rodando.tecla(e);return}
  if(e.key==="Enter"){const v=ent.value;ent.value="";executar(v)}
  else if(e.key==="ArrowUp"){e.preventDefault();if(hi>0){hi--;ent.value=hist[hi]}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(hi<hist.length-1){hi++;ent.value=hist[hi]}else{hi=hist.length;ent.value=""}}
  else if(e.key==="Tab"){e.preventDefault();const p=ent.value.split(/\s+/);
    if(p.length===1){const m=nomesAtuais().filter(n=>n.startsWith(p[0].toLowerCase()));if(m.length===1)ent.value=m[0]+" ";else if(m.length>1)imp(m.join("  "),"dim")}
    else{const k=ALIAS[p[0].toLowerCase()];
      if(k==="projeto"||k==="cat"){const base=k==="cat"?PROJ.map(x=>DIRP[lang]+"/"+x.id).concat(ARQ.map(f=>f[lang])):PROJ.map(x=>x.id);const m=base.filter(n=>n.startsWith(p[1]||""));if(m.length===1)ent.value=p[0]+" "+m[0];else if(m.length>1)imp(m.join("  "),"dim")}
      else if(k==="idioma"){ent.value=p[0]+" "+(lang==="pt"?"en":"pt")}}}
  else if(e.key==="l"&&e.ctrlKey){e.preventDefault();cmds.limpar()}
});
document.addEventListener("keydown",e=>{
  if(!linha.hidden&&rodando&&document.activeElement!==ent){rodando.tecla&&rodando.tecla(e)}
  if(!bootFeito){pulou=true}
},true);
saida.addEventListener("click",e=>{const c=e.target.closest(".cmd");if(c&&!rodando){executar(c.dataset.cmd)}});
tela.addEventListener("pointerdown",e=>{if(!bootFeito)pulou=true});
tela.addEventListener("click",e=>{if(bootFeito&&!getSelection().toString()&&!e.target.closest("a,button,.cmd"))ent.focus({preventScroll:true})});

  imp(`<span class="dim">${T("English? Clique em EN no canto ou digite","Português? Click PT at the corner or type")} ${C(nm("idioma")+" "+T("en","pt"))}</span>`);nl()}
async function boot(){
  try{const t=localStorage.getItem("tema");if(t&&["verde","ambar","branco","azul"].includes(t))tela.dataset.tema=t}catch(e){}
  aplicarIdioma();
  const linhas=lang==="pt"
   ?["LQ-BIOS v2.7  (C) 2026 Lázaro Queiroz Systems","CPU: Go-486DX @ 66MHz ........ OK","Memória: 640K ................. OK  (deveria bastar)","Cache L1/L2 (LRU, LFU, ÓTIMO) . OK","Montando /home/lazaro ......... OK","Carregando projetos ........... OK","Conectando à internet ......... 56k modem 📞 OK"]
   :["LQ-BIOS v2.7  (C) 2026 Lázaro Queiroz Systems","CPU: Go-486DX @ 66MHz ........ OK","Memory: 640K .................. OK  (should be enough)","Cache L1/L2 (LRU, LFU, OPT) .. OK","Mounting /home/lazaro ......... OK","Loading projects .............. OK","Connecting to internet ........ 56k modem 📞 OK"];
  if(!pulou&&!reduzir)for(const l of linhas){imp(esc(l));await dormir(pulou?0:230)}
  else linhas.forEach(l=>imp(esc(l)));
  nl();boasVindas();
  bootFeito=true;$("#dica").hidden=true;mostrarPrompt();
  const q=decodeURIComponent(location.hash.slice(1));if(q&&ALIAS[q.split(" ")[0].toLowerCase()])executar(q)}
boot();
})();
