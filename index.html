function chuva(){

  const pre=document.createElement("pre");pre.className="jogo";const box=imp("");box.appendChild(pre);
  const info=imp("");
  const ctl=document.createElement("div");ctl.className="ctl";
  [["",""],["▲","c"],["",""],["◀","a"],["▼","b"],["▶","d"]].forEach(([t,k])=>{const b=document.createElement("button");b.textContent=t;b.style.visibility=t?"visible":"hidden";
    b.addEventListener("pointerdown",e=>{e.preventDefault();mover(k==="c"?[0,-1]:k==="b"?[0,1]:k==="a"?[-1,0]:[1,0])});ctl.appendChild(b)});
  const wrap=imp("");wrap.appendChild(ctl);
  function mover(d){if(d[0]!==-dir[0]||d[1]!==-dir[1])prox=d}
  function soltar(){const c=[0,0];do{c[0]=Math.floor(Math.random()*W);c[1]=Math.floor(Math.random()*H)}while(cobra.some(s=>s[0]===c[0]&&s[1]===c[1]));comida=c}
  function desenhar(){
    let s="┌"+"─".repeat(W)+"┐\n";
    for(let j=0;j<H;j++){s+="│";for(let i=0;i<W;i++){s+=cobra[0][0]===i&&cobra[0][1]===j?"@":cobra.some(p=>p[0]===i&&p[1]===j)?"o":comida[0]===i&&comida[1]===j?"*":" "}s+="│\n"}
    pre.textContent=s+"└"+"─".repeat(W)+"┘";info.textContent=vivo?`pontos: ${pts}   recorde: ${rec}   (setas/WASD, q sai)`:`GAME OVER — ${pts} pontos${pts>rec?" · NOVO RECORDE!":""}. Digite 'jogar' para tentar de novo.`}
  function fim(){clearInterval(t);rodando=null;if(pts>rec){try{localStorage.setItem("snake",pts)}catch(e){}}desenhar();ent.focus()}
  function passo(){
    dir=prox;const c=[cobra[0][0]+dir[0],cobra[0][1]+dir[1]];
    if(c[0]<0||c[1]<0||c[0]>=W||c[1]>=H||cobra.some(s=>s[0]===c[0]&&s[1]===c[1])){vivo=false;return fim()}
    cobra.unshift(c);if(c[0]===comida[0]&&c[1]===comida[1]){pts++;soltar()}else cobra.pop();desenhar()}
  rodando={tecla(e){const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
    if(m){mover(m)}else if(e.key==="q"||e.key==="Escape"){vivo=false;fim()}}};
  const t=setInterval(passo,110);desenhar()}

/* ---------- terminal ---------- */
const T0=Date.now();let pulou=false,hist=[],hi=0;
const PS=()=>"visitante@lazaro:~$";
function mostrarPrompt(){pr.textContent=PS();linha.hidden=false;ent.focus({preventScroll:true});rol.scrollTop=rol.scrollHeight}
async function executar(txt){
  const bruto=txt.trim();
  imp(`<span class="hl">${PS()}</span> ${esc(txt)}`);
  if(!bruto)return;
  hist.push(bruto);hi=hist.length;
  const [c,...a]=bruto.split(/\s+/);const f=cmds[c.toLowerCase()];
  if(Object.prototype.hasOwnProperty.call(cmds,c.toLowerCase())&&typeof f==="function")f(a);
  else{const sug=NOMES.filter(n=>n.startsWith(c.toLowerCase().slice(0,2)))[0];imp(`${esc(c)}: comando não encontrado. ${sug?`Quis dizer ${C(sug)}? `:""}Digite ${C("ajuda")}.`,"err")}
}
ent.addEventListener("keydown",e=>{
  if(rodando){e.preventDefault();rodando.tecla&&rodando.tecla(e);if(rodando&&rodando.fim)return;return}
  if(e.key==="Enter"){const v=ent.value;ent.value="";executar(v)}
  else if(e.key==="ArrowUp"){e.preventDefault();if(hi>0){hi--;ent.value=hist[hi]}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(hi<hist.length-1){hi++;ent.value=hist[hi]}else{hi=hist.length;ent.value=""}}
  else if(e.key==="Tab"){e.preventDefault();const p=ent.value.split(/\s+/);
    if(p.length===1){const m=NOMES.filter(n=>n.startsWith(p[0].toLowerCase()));if(m.length===1)ent.value=m[0]+" ";else if(m.length>1)imp(m.join("  "),"dim")}
    else if(p[0]==="projeto"||p[0]==="cat"){const base=p[0]==="cat"?PROJ.map(x=>"projetos/"+x.id).concat(Object.keys(ARQ)):PROJ.map(x=>x.id);const m=base.filter(n=>n.startsWith(p[1]||""));if(m.length===1)ent.value=p[0]+" "+m[0];else if(m.length>1)imp(m.join("  "),"dim")}}
  else if(e.key==="l"&&e.ctrlKey){e.preventDefault();cmds.limpar()}
});
document.addEventListener("keydown",e=>{
  if(!linha.hidden&&rodando&&document.activeElement!==ent){rodando.tecla&&rodando.tecla(e)}
  if(!bootFeito){pulou=true}
},true);
saida.addEventListener("click",e=>{const c=e.target.closest(".cmd");if(c&&!rodando){executar(c.dataset.cmd)}});
tela.addEventListener("pointerdown",e=>{if(!bootFeito)pulou=true});
tela.addEventListener("click",e=>{if(bootFeito&&!getSelection().toString()&&!e.target.closest("a,button,.cmd"))ent.focus({preventScroll:true})});
["sobre","experiencia","projetos","skills","contato","ajuda","tema azul"].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>{if(!bootFeito){pulou=true;return}if(rodando){return}executar(c);ent.focus({preventScroll:true})};atalhos.appendChild(b)});

let bootFeito=false;
async function boot(){
  try{const t=localStorage.getItem("tema");if(t)tela.dataset.tema=t}catch(e){}
  const linhas=["LQ-BIOS v2.7  (C) 2026 Lázaro Queiroz Systems","CPU: Go-486DX @ 66MHz ........ OK","Memória: 640K ................. OK  (deveria bastar)",
   "Cache L1/L2 (LRU, LFU, ÓTIMO) . OK","Montando /home/lazaro ......... OK","Carregando projetos ........... OK","Conectando à internet ......... 56k modem 📞 OK"];
  if(!pulou&&!reduzir)for(const l of linhas){imp(esc(l));await dormir(pulou?0:230)}
  else linhas.forEach(l=>imp(esc(l)));
  nl();imp(`<span class="hl">${esc(BANNER)}</span>`);
  imp(`<span class="hl">Lázaro Queiroz do Nascimento</span> <span class="dim">— Engenheiro de Software · UFCG</span>`);
  imp(`<span class="dim">Sistemas distribuídos · caches · Go · Clojure · DevOps</span>`);
  nl();imp(`Bem-vindo(a)! Digite ${C("ajuda")} ou clique em um comando: ${C("sobre")} · ${C("projetos")} · ${C("experiencia")} · ${C("contato")}`);nl();
  bootFeito=true;$("#dica").hidden=true;mostrarPrompt();
  const q=decodeURIComponent(location.hash.slice(1));if(q&&cmds[q.split(" ")[0]])executar(q)}
boot();
})();
